<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>冷氣型號管理系統</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 30px auto; padding: 20px; }
        h1, h2 { color: #2c3e50; }
        .box { background: #f8f9fa; border: 1px solid #ddd; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background-color: #27ae60; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .msg { padding: 10px; background-color: #d4edda; color: #155724; border-radius: 4px; margin-bottom: 15px; }
        .error { padding: 10px; background-color: #f8d7da; color: #721c24; border-radius: 4px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <h1>❄️ {{ title }}</h1>

    {% if message %}
        <div class="msg">{{ message }}</div>
    {% endif %}
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <div class="box">
        <h2>➕ 新增冷氣資料</h2>
        <form action="/add" method="post">
            <div class="form-group">
                <label>品牌：</label>
                <input type="text" name="brand" placeholder="例如：日立、國際牌" required>
            </div>
            <div class="form-group">
                <label>型號：</label>
                <input type="text" name="model_number" placeholder="例如：RAC-28YB" required>
            </div>
            <div class="form-group">
                <label>冷房能力 (kW)：</label>
                <input type="number" step="0.1" name="cooling_capacity" placeholder="例如：2.8" required>
            </div>
            <div class="form-group">
                <label>備註：</label>
                <textarea name="notes" placeholder="例如：適用 4-5 坪"></textarea>
            </div>
            <button type="submit">儲存資料</button>
        </form>
    </div>
</body>
</html>
