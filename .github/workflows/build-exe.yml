name: Build Windows Exe

on:
  push:
    tags:
      - 'v*' # 當 Push 的 Tag 是 v 開頭時觸發 (例如 v1.0.0)

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 1. 檢出程式碼
        uses: actions/checkout@v4

      - name: 2. 安裝 uv 套件管理工具
        uses: astral-sh/setup-uv@v3

      - name: 3. 設定 Python 3.11 環境
        run: uv python install 3.11

      - name: 4. 安裝專案依賴與 PyInstaller
        run: |
          uv pip install --system fastapi uvicorn jinja2 python-multipart pyinstaller

      - name: 5. 執行 PyInstaller 打包 Windows .exe
        run: |
          pyinstaller --noconfirm --onefile --windowed --add-data "templates;templates" --name "AC_Management" run.py

      - name: 6. 自動發布 Release 並附上 exe 下載檔
        uses: softprops/action-gh-release@v1
        with:
          files: dist/AC_Management.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}